<style>
/* Layout: one-screen landscape game. The world is pixel art (sprite sheets); every menu, card and HUD element is a sober, non-pixel UI. Single bright look by choice. */
:root{
  --ink:#1b1f2a; --muted:#5b6475; --paper:#ffffff; --line:#e3e7ee; --accent:#d63b3b; --blue:#2563eb; --green:#16a34a;
  --ui:Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; --title:Fraunces,Georgia,serif;
  color-scheme: light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:#0f1d33;color:var(--ink);font-family:var(--ui);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{background:#0b1526}
#wrap{position:absolute;left:0;top:0;width:845px;height:390px;overflow:hidden;transform-origin:0 0;background:#4a90d9}
canvas{display:block;width:100%;height:100%;touch-action:none}
.corner{position:absolute;top:30px;right:12px;display:flex;gap:8px;z-index:5}
.ib{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(15,29,51,.25);cursor:pointer;display:grid;place-items:center;color:var(--ink);padding:0}
.ib:hover{background:#fff}
.ib:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ib svg{width:20px;height:20px}
.ib img{width:24px;height:24px;object-fit:contain;display:block}
@media (pointer: coarse){ .corner{gap:10px} .ib{width:38px;height:38px} .ib svg{width:19px;height:19px} .ib img{width:24px;height:24px} }
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-inline:16px;background:rgba(15,29,51,.4);z-index:4}
.card{background:#fffaf0;border:3px solid #1b2433;border-radius:10px;box-shadow:7px 7px 0 #1b2433;max-width:520px;width:100%;max-height:calc(100% - 28px);overflow:auto;padding:26px 28px;display:flex;flex-direction:column;gap:12px;text-align:center;box-sizing:border-box}
.logo{font-weight:800;font-size:clamp(2rem,6.5vw,3rem);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
.card p{margin:0;font-size:1.05rem;line-height:1.4;color:var(--ink)}
.card .small{font-size:.85rem;color:var(--muted)}
.tiles{display:flex;gap:12px;justify-content:center}
.tile{flex:1;min-width:0;background:#fff;border:3px solid #1b2433;border-radius:8px;box-shadow:4px 4px 0 #1b2433;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile svg{width:30px;height:30px}
.tile b{font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.card .score{font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.actions{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.big{font-family:var(--ui);font-weight:800;font-size:1.15rem;background:var(--ink);color:#fff;border:3px solid #1b2433;border-radius:8px;box-shadow:4px 4px 0 #1b2433;padding:11px 28px;cursor:pointer}
.big:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1b2433}
.big.go{background:var(--green)}
.big.go:hover{background:#12873d}
.big:not(.go):hover{background:#2c3446}
.tuto{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;cursor:pointer;padding:8px 14px;border:3px solid #1b2433;border-radius:8px;background:#fff;box-shadow:4px 4px 0 #1b2433}
.tuto input{width:18px;height:18px;accent-color:var(--green);margin:0}
button.tuto{font-family:var(--ui);color:var(--ink)}
.tuto svg{width:18px;height:18px}
.levels{display:inline-flex;border:3px solid #1b2433;border-radius:8px;box-shadow:4px 4px 0 #1b2433;overflow:hidden;background:#fff}
.levels button{font-family:var(--ui);font-weight:800;font-size:.95rem;border:0;background:#fff;color:var(--ink);padding:8px 12px;cursor:pointer}
.levels button+button{border-left:2px solid #1b2433}
.levels button[aria-pressed="true"]{background:var(--ink);color:#fff}
#debug select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px 6px}
/* title and end screens: the illustration is laid out in image pixels (u = one image pixel), the card covers the painted one */
.screen{position:absolute;inset:0;z-index:4;overflow:hidden;background:#0f1d33}
.sbg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(18px) brightness(.8)}
.stage{position:absolute;--u:1px}
.stage>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.scard{position:absolute;box-sizing:border-box;background:#fffaf0;border:calc(var(--u)*6) solid #14213d;border-radius:calc(var(--u)*16);box-shadow:calc(var(--u)*10) calc(var(--u)*10) 0 rgba(20,26,40,.85);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;color:#14213d}
.scard h1{margin:0;line-height:1.05;letter-spacing:-.01em}
.scard p{margin:0}
.s-start{padding:calc(var(--u)*34) calc(var(--u)*30) calc(var(--u)*26)}
.s-start h1{font-family:var(--title);font-weight:900;font-size:calc(var(--u)*112);color:#13234a;text-shadow:0 calc(var(--u)*-3) 0 #f2b630,calc(var(--u)*3) 0 0 #f2b630,0 calc(var(--u)*3) 0 #f2b630,calc(var(--u)*-3) 0 0 #f2b630,calc(var(--u)*6) calc(var(--u)*6) 0 rgba(20,26,40,.35)}
.s-start #tSub{font-family:var(--ui);font-weight:700;font-size:calc(var(--u)*40);line-height:1.25;max-width:calc(var(--u)*980)}
.s-end{padding:calc(var(--u)*30) calc(var(--u)*30) calc(var(--u)*30)}
.s-end h1{font-family:var(--title);font-weight:900;font-size:calc(var(--u)*70)}
.ssub{font-size:calc(var(--u)*28);font-weight:600;color:#5b6475}
.ssub:empty{display:none}
.srow{display:flex;gap:calc(var(--u)*22);align-items:stretch;justify-content:center;width:100%}
.sbtn{white-space:nowrap;font-family:var(--ui);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--u)*14);background:#fff;color:#14213d;border:calc(var(--u)*5) solid #14213d;border-radius:calc(var(--u)*12);box-shadow:calc(var(--u)*6) calc(var(--u)*6) 0 #14213d;cursor:pointer;padding:0 calc(var(--u)*26);box-sizing:border-box}
.sbtn:active{transform:translate(calc(var(--u)*4),calc(var(--u)*4));box-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 #14213d}
.sbtn.go{background:#22a447;color:#fff}
.sbtn.ic{padding:0;aspect-ratio:1/1}
.s-start .sbtn.ic{width:calc(var(--u)*116)}
.s-end .sbtn.ic{width:calc(var(--u)*86)}
.sbtn.go:hover{background:#1c8f3d}
.sbtn svg{width:calc(var(--u)*44);height:calc(var(--u)*44)}
.sbtn input{width:calc(var(--u)*40);height:calc(var(--u)*40);accent-color:#22a447;margin:0}
.s-start .sbtn{font-family:var(--ui);font-size:calc(var(--u)*44);height:calc(var(--u)*116);font-weight:800}
.s-start .sbtn.go{font-size:calc(var(--u)*56);min-width:calc(var(--u)*390);font-weight:700}
.s-end .srow{gap:calc(var(--u)*16)}
.s-end .sbtn{font-size:calc(var(--u)*30);height:calc(var(--u)*86);padding:0 calc(var(--u)*18);gap:calc(var(--u)*10)}
.s-end .sbtn svg{width:calc(var(--u)*38);height:calc(var(--u)*38)}
.s-end .sbtn input{width:calc(var(--u)*34);height:calc(var(--u)*34)}
.s-end .sbtn.go{font-size:calc(var(--u)*40);min-width:calc(var(--u)*270)}
.srec{font-size:calc(var(--u)*30);font-weight:600;color:#3d5a8a}
.s-start .srec{font-family:var(--ui)}
.srec:empty{visibility:hidden}
.stiles{display:flex;gap:calc(var(--u)*22);width:100%;justify-content:center}
.stile{flex:1;background:#fff;border:calc(var(--u)*5) solid #14213d;border-radius:calc(var(--u)*12);box-shadow:calc(var(--u)*6) calc(var(--u)*6) 0 #14213d;padding:calc(var(--u)*14) calc(var(--u)*8);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*4)}
.stile svg{width:calc(var(--u)*50);height:calc(var(--u)*50)}

let tFlight, realT = 0, py, vy, aIn, aVane, holding, holdT = 0, relT = 0, inv, poll, coins, stats, onWater = false, blownT = 0, blowGauge = 0, endReason = '', orbs, nextOrb, wind = 1, windEmptyT = -9;
let phase = 'fly', stormT = 0, emitter = null, pans = [], bubbles = [], cass = 0, chain = [], nextSalvo = 0, nextBubble = 0, dark = 0, bannerT = 0, flash = 0, cassInv = 0;
let coinsList, journos, pops, fx, nextSpawn, coinChain, coinChainT, lastDt = 0, sea = 'cote', spawnI = 0;
let keyUp = false, keyDown = false, pointerY = null, pointerDown = false;

function start(){
  applyCam(); seed = 7; realT = 0; tFlight = 0; py = P.yMax; vy = 0; aIn = 0; aVane = 0; holding = false; holdT = relT = 0; inv = 0; onWater = true; blownT = 0; blowGauge = 0; endReason = ''; orbs = []; nextOrb = 6; wind = 1; windEmptyT = -9;
  phase = 'fly'; stormT = 0; emitter = null; pans = []; bubbles = []; cass = 0; chain = []; nextSalvo = 0; nextBubble = 0; dark = 0; bannerT = 0; flash = 0; cassInv = 0;
  poll = P.pollStart; coins = 0; stats = {hits: 0, orbs: 0, coins: 0, cass: 0, bubbles: 0};
  coinsList = []; journos = []; pops = []; fx = []; nextSpawn = 1.2; coinChain = 0; coinChainT = -9; sea = 'cote'; spawnI = 0; patOrder = [];
  pointerY = null; pointerDown = false; keyUp = keyDown = false;
  state = 'play'; paused = false;
  document.getElementById('titleScreen').hidden = true;
  ensureAudio(); musicStart();
}
let testStorm = false;
function startTest(){ testStorm = true; start(); startStorm(); }
function toTitle(){ state = 'title'; musicStop(); document.getElementById('titleScreen').hidden = false; }

// ---------- commandes ----------
function inputFromPointer(ly){ const raw = clamp((H/2 - ly)/(H*P.windRange/200), -1, 1); return Math.sign(raw)*Math.pow(Math.abs(raw), P.windCurve); }
// Un pas du modèle « appui » : st = {vy, holdT, relT}, modifié en place.
// Accélérations dérivées : la montée part à 35 % et atteint 100 % en tUp (la vitesse max arrive alors exactement à tUp) ; la gravité part à 25 % et atteint 100 % en tDown.
function tapStep(st, hold, dt){
  const aUp = P.vUp/(0.675*P.tUp), aDown = P.vDown/(0.625*P.tDown), brake = Math.max(P.vUp, P.vDown)/P.tTurn;
  if (hold){
    st.relT = 0;
    if (st.vy > 0){ st.vy = Math.max(0, st.vy - brake*dt); st.holdT = 0; }   // on appuie en descente : inversion d'abord
    else { st.holdT += dt; const a = aUp*lerp(0.35, 1, clamp(st.holdT/P.tUp, 0, 1)); st.vy = Math.max(-P.vUp, st.vy - a*dt); }
  } else {
    st.holdT = 0;
    if (st.vy < 0){ st.vy = Math.min(0, st.vy + brake*dt); st.relT = 0; }   // on relâche en montée : la montée s'annule
    else { st.relT += dt; if (st.relT >= P.glide){ const a = aDown*lerp(0.25, 1, clamp((st.relT - P.glide)/P.tDown, 0, 1)); st.vy = Math.min(P.vDown, st.vy + a*dt); } }   // sinon : plané
  }
}
function applyInput(dt){
  if (ctrl === 'tap'){
    const want = pointerDown || keyUp;
    // réserve de vent : l'appui consomme (sauf sur l'eau), la glisse sur l'eau recharge ; vide, l'appui ne répond plus
    if (want && !onWater){ wind = Math.max(0, wind - dt/P.windCap); if (wind === 0 && windEmptyT < 0){ windEmptyT = realT; sfxP3('down'); } }
    if (onWater) wind = Math.min(1, wind + dt/P.windRefill);
    if (wind > 0) windEmptyT = -9;
    holding = want && (wind > 0 || onWater);
    const st = {vy, holdT, relT}; tapStep(st, holding, dt); vy = st.vy; holdT = st.holdT; relT = st.relT;
  } else {
    if (pointerDown && pointerY !== null) aIn = inputFromPointer(pointerY);
    else if (keyUp || keyDown) aIn = clamp(aIn + ((keyUp ? 1 : 0) - (keyDown ? 1 : 0))*3*dt, -1, 1);
    // doigt levé : la direction donnée se maintient
    const rate = 2/Math.max(0.02, P.windLag);   // la girouette parcourt un demi-tour (2 unités) en windLag s
    aVane += clamp(aIn - aVane, -rate*dt, rate*dt);
    const a = Math.abs(aVane) < P.windDead/100 ? 0 : aVane;
    vy = -a*P.windV;
  }
  const vyBefore = vy;
  py += vy*dt;
  if (py < P.ceil - 40) py = P.ceil - 40;   // on ne monte pas plus haut que la zone des orbes
  if (py >= P.yMax){
    py = P.yMax; if (vy > 0) vy = 0;
    if (!onWater){ sfxP3('plouf'); fx.push({kind: 'splash', x: PX(), y: WATER, t: 0, big: vyBefore > 300}); onWater = true; wind = Math.max(wind, P.windMin/100); }
  } else if (onWater && py < P.yMax - 2) onWater = false;
  // limite d'altitude : au-dessus, la jauge d'emportement se remplit ; pleine, le vent emporte Marine
  if (py < P.ceil){ const was = blowGauge; blowGauge = Math.min(1, blowGauge + dt/P.blowT); if (was === 0) sfxP3('alert'); if (blowGauge >= 1){ state = 'blown'; blownT = 0; endReason = 'blown'; sfxP3('gust'); } }
  else blowGauge = Math.max(0, blowGauge - dt/P.blowT*1.5);
}
// orbes d'argent : au-dessus de la limite, annoncées 1 s avant d'entrer, toujours en concurrence avec un bloc de pièces en bas
function addOrb(x){ orbs.push({x, y: P.ceil - 22, alert: 1.0, ph: rnd()*6.3}); }

cv.addEventListener('pointerdown', e => { ensureAudio(); if (state !== 'play' || phase === 'intro') return; e.preventDefault(); const l = toLocal(e); pointerDown = true; pointerY = l.y; });
cv.addEventListener('pointermove', e => { if (!pointerDown) return; const l = toLocal(e); pointerY = l.y; });
const up = () => { pointerDown = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); window.addEventListener('blur', up);
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') keyUp = true;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') keyDown = true;
  if (e.code === 'Space'){ if (state === 'play' && phase !== 'intro') keyUp = true; e.preventDefault(); }
  if (e.code === 'Enter' && state === 'title') start();
  if (e.code === 'Enter' && state === 'recap'){ if (testStorm) startTest(); else start(); }
  if ((e.code === 'Enter' || e.code === 'Space') && state === 'play' && phase === 'intro' && introT > 0.4) beginStormPlay();
  if (e.code === 'KeyP' && state === 'play') togglePause();
});
window.addEventListener('keyup', e => { if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keyUp = false; if (e.code === 'ArrowDown' || e.code === 'KeyS') keyDown = false; });

// ---------- génération du vol ----------
// Chaque motif est posé à droite de l'écran (x = VW + marge) et défile vers la gauche.
// Les pièces grossissent un peu quand la caméra recule, pour rester lisibles à l'écran
const coinK = () => clamp(Math.sqrt(0.8/Z)*1.15, 1, 2), coinR = () => P.coinR*coinK(), coinGap = () => P.coinGap*coinK();
const COIN_TOP = () => P.ceil + 60;   // les pièces restent au moins 60 px sous la limite
function addCoin(x, y, block){ if (y < COIN_TOP() || y > P.yMax + 10) return; coinsList.push({x, y, r: coinR(), block, ph: rnd()*6.3}); block.n++; }
function newBlock(){ const b = {n: 0, got: 0, done: false}; return b; }
function coinLine(x0, y, n, b){ for (let i=0;i<n;i++) addCoin(x0 + i*coinGap(), y, b); return x0 + n*coinGap(); }
function coinRect(x0, y0, cols, rows, b){ for (let i=0;i<cols;i++) for (let j=0;j<rows;j++) addCoin(x0 + i*coinGap(), y0 + j*coinGap(), b); return x0 + cols*coinGap(); }
// Trajectoire simulée avec le modèle de vol courant : schedule = [[appui ?, durée en s], ...] depuis l'altitude y0, stationnaire.
// Renvoie des points espacés de coinGap() en x ; sert à poser des pièces exactement là où un vol naturel passe.
function simPath(y0, schedule){
  const st = {vy: 0, holdT: 0, relT: 0}, pts = [], dt = 1/120, vx = worldSpeed(); let y = y0, x = 0, nextX = 0;
  for (const [hold, dur] of schedule){ for (let t = 0; t < dur; t += dt){ tapStep(st, hold, dt); y = clamp(y + st.vy*dt, COIN_TOP(), P.yMax); if (y === P.yMax && st.vy > 0) st.vy = 0; x += vx*dt; if (x >= nextX){ pts.push([x, y]); nextX += coinGap(); } } }
  return pts;
}
// rows = nombre de lignes parallèles (empilées vers le bas) ; 2 par défaut, parfois 3 ou 4
function coinPath(x0, pts, b, from, to, rows){ const a = from || 0, z = to === undefined ? pts.length : to, n = rows || nRows(); for (let i = a; i < z; i++) for (let r = 0; r < n; r++) addCoin(x0 + pts[i][0], pts[i][1] + r*coinGap(), b); return x0 + (pts.length ? pts[pts.length - 1][0] : 0) + coinGap(); }
function nRows(){ const h = rnd(); return h < 0.55 ? 2 : h < 0.85 ? 3 : 4; }
function coinLines(x0, y, n, b, rows){ const r = rows || nRows(); for (let k = 0; k < r; k++) coinLine(x0, y + k*coinGap(), n, b); return x0 + n*coinGap(); }
const sec = t => t*worldSpeed();   // secondes de vol -> px monde
const BANDS = () => ({low: [WATER - 110, WATER - 70], mid: [lerp(P.ceil, WATER, 0.5) - 40, lerp(P.ceil, WATER, 0.5) + 40], high: [COIN_TOP() + 30, COIN_TOP() + 110], bait: [COIN_TOP(), COIN_TOP() + 16]});
const bandY = k => { const b = BANDS()[k]; return lerp(b[0], b[1], rnd()); };
function addBoat(x){ journos.push({kind: 'boat', x, y: WATER - 2, w: 92, h: 50, fr: Math.floor(rnd()*6), bob: rnd()*6}); }
function addGlider(x, y){ journos.push({kind: 'glider', x, y, w: 92, h: 44, bob: rnd()*6, col: pick(['#d63b3b', '#2563eb', '#f2b630'])}); }
function addHeli(x, y, track){ journos.push({kind: 'heli', x, y, w: 78, h: 40, bob: rnd()*6, track: track ? 3.2 : 0, alert: track ? 1.1 : 0, vx: track ? worldSpeed()*0.65 : 0}); }
const worldSpeed = () => P.speed/Z;   // la vitesse se règle en px écran/s ; en px monde elle dépend de la caméra
// Chaque motif reçoit x (bord droit du monde) et renvoie sa longueur en px monde. Les durées sont en secondes de vol, les altitudes relatives à la limite et à l'eau.
const PATTERNS = [
  // 1. montée naturelle : depuis le ras de l'eau, un appui tenu 0,8 s puis relâché ; une barque sous le départ oblige à décoller
  x => { const pts = simPath(WATER - 90, [[true, 0.8], [false, 0.5]]); const b = newBlock(); coinPath(x + sec(0.3), pts, b); addBoat(x + sec(0.9)); return sec(1.3) + pts[pts.length - 1][0]; },
  // 2. piqué naturel : depuis le haut, relâche 0,7 s puis appui 0,45 s (ressource) ; un deltaplane attend au fond du creux, juste après
  x => { const y0 = COIN_TOP() + 60, pts = simPath(y0, [[false, 0.7], [true, 0.45]]); const b = newBlock(); coinPath(x, pts, b); const low = pts.reduce((m, q) => Math.max(m, q[1]), 0); addGlider(x + pts[pts.length - 1][0] + sec(0.45), low); return pts[pts.length - 1][0] + sec(1.0); },
  // 3. vague : appui 0,4 s / relâche 0,5 s trois fois, depuis le milieu ; une barque sous le dernier creux
  x => { const y0 = lerp(COIN_TOP(), WATER, 0.55), pts = simPath(y0, [[true, 0.4], [false, 0.5], [true, 0.4], [false, 0.5], [true, 0.4], [false, 0.5]]); const b = newBlock(); coinPath(x, pts, b); addBoat(x + pts[pts.length - 1][0] - sec(0.2)); return pts[pts.length - 1][0] + sec(0.8); },
  // 4. deux rubans : deux rubans de 2 lignes à 120 px d'écart en haut, il faut en choisir un ; un hélico traqueur arrive après
  x => { const y = bandY('high'), b = newBlock(); coinLines(x, y, 14, b, 2); coinLines(x, y + 120, 14, b, 2); addHeli(x + 14*coinGap() + sec(0.6), y + 60, true); return 14*coinGap() + sec(1.6); },
  // 5. escalier : trois paliers ; l'écart entre paliers = le temps d'un appui de 0,35 s dans le modèle courant
  x => { const st = simPath(lerp(COIN_TOP(), WATER, 0.7), [[true, 0.35], [false, 0.05]]), dy = st[0][1] - st[st.length - 1][1], dx = st[st.length - 1][0]; let y = lerp(COIN_TOP(), WATER, 0.7), xx = x; const b = newBlock(), r = nRows();
    for (let k=0;k<3;k++){ coinLines(xx, y, 6, b, r); xx += 6*coinGap() + dx; y -= dy; } addBoat(x + sec(0.4)); return xx - x + sec(0.6); },
  // 6. rampe : un piqué qui finit au ras de l'eau (relâche jusqu'à la pose), puis une barque pour redécoller
  x => { const pts = simPath(lerp(COIN_TOP(), WATER, 0.5), [[false, 2.5]]); let n = pts.findIndex(q => q[1] >= P.yMax - 2); if (n < 0) n = pts.length; const b = newBlock(); coinPath(x, pts, b, 0, n, 2); const xe = x + pts[Math.max(0, n - 1)][0]; addBoat(xe + sec(1.2)); return pts[Math.max(0, n - 1)][0] + sec(1.9); },
  // 7. couloir : un ruban au milieu, des barques dessous toutes les 1,1 s, un hélico traqueur au-dessus
  x => { const y = bandY('mid'), b = newBlock(); coinLines(x, y, 24, b); addBoat(x + sec(0.2)); addBoat(x + sec(1.3)); addHeli(x + sec(0.5), COIN_TOP() + 50, true); return 24*coinGap() + sec(0.8); },
  // 8. l'appât : un ruban juste sous la zone interdite aux pièces, puis un deltaplane juste dessous : descendre vite ou monter mourir
  x => { const b = newBlock(); coinLines(x, bandY('bait'), 16, b, 3); addGlider(x + 16*coinGap() + sec(0.4), COIN_TOP() + 90); return 16*coinGap() + sec(1.2); },
  // 9. saute-barques : un ruban au ras de l'eau (on glisse et on recharge), trois barques espacées de 1,2 s à sauter
  x => { const b = newBlock(); coinLines(x, P.yMax - coinGap(), 36, b, 2); addBoat(x + sec(0.3)); addBoat(x + sec(1.5)); addBoat(x + sec(2.7)); return 36*coinGap() + sec(0.6); },
  // 13. la glisse : un long ruban sur l'eau sans obstacle, pour recharger et ramasser ; un hélico fixe en haut pour ceux qui voudraient rester en l'air
  x => { const b = newBlock(); coinLines(x, P.yMax - coinGap(), 30, b, 3); addHeli(x + sec(0.8), COIN_TOP() + 80, false); return 30*coinGap() + sec(0.8); },
  // 14. le tremplin : glisse sur l'eau, puis une barque, puis une montée naturelle (appui 0,9 s) qui part juste après la barque
  x => { const b = newBlock(); coinLines(x, P.yMax - coinGap(), 12, b, 2); addBoat(x + 12*coinGap() + sec(0.35)); const pts = simPath(P.yMax - 10, [[true, 0.9], [false, 0.6]]); coinPath(x + 12*coinGap() + sec(0.75), pts, b); return 12*coinGap() + sec(0.75) + pts[pts.length - 1][0] + sec(0.6); },
  // 10. bloc : un rectangle 8 × 4 au milieu, un deltaplane devant et un derrière à la même altitude : on entre et on sort par le haut ou le bas
  x => { const y = bandY('mid'), b = newBlock(); addGlider(x, y + 1.5*coinGap()); coinRect(x + sec(0.5), y, 8, 4, b); addGlider(x + sec(0.5) + 8*coinGap() + sec(0.45), y + 1.5*coinGap()); return sec(1.0) + 8*coinGap() + sec(0.8); },
  // 11. montée en deux temps : deux appuis de 0,3 s séparés par une relâche de 0,3 s, depuis le bas ; un hélico fixe guette en haut
  x => { const pts = simPath(WATER - 100, [[true, 0.3], [false, 0.3], [true, 0.3], [false, 0.4]]); const b = newBlock(); coinPath(x, pts, b); addHeli(x + pts[pts.length - 1][0] + sec(0.5), pts[pts.length - 1][1] - 20, false); return pts[pts.length - 1][0] + sec(1.3); },
  // 12. le mur de pièces : un rectangle 5 × 6 au milieu, sans obstacle : la razzia
  x => { const y = lerp(COIN_TOP(), WATER, 0.45), b = newBlock(); coinRect(x, y, 5, 6, b); return 5*coinGap() + sec(0.8); },
];
let patOrder = [];
function spawn(){
  const x = VWW + 60;
  if (!patOrder.length){ patOrder = PATTERNS.map((_, i) => i); for (let i = patOrder.length - 1; i > 0; i--){ const j = Math.floor(rnd()*(i + 1)); [patOrder[i], patOrder[j]] = [patOrder[j], patOrder[i]]; } }
  const w = PATTERNS[patOrder.pop()](x);   // chaque motif passe une fois avant qu'un ne revienne
  spawnI++;
  nextSpawn = (w + sec(0.5 + rnd()*0.4))/worldSpeed();
}

// ---------- mise à jour ----------
function pop(t, color, x, y, big){ pops.push({t, color, x, y, life: big ? 1.6 : 1.1, max: big ? 1.6 : 1.1, big}); }
function addPoll(v){ poll = clamp(poll + v, 0, 100); }
function update(dt){
  realT += dt;
  if (state === 'blown'){ blownT += dt; py -= 900*dt; scrollX += worldSpeed()*dt*0.5; if (blownT > 0.8){ state = 'recap'; musicStop(); } return; }
  if (state !== 'play' || paused) return;
  tFlight += dt; lastDt = dt;
  if (phase === 'fly' && tFlight >= P.flight) startStorm();
  if (phase === 'intro'){ introT += dt; if (emitter){ emitter.frT += dt; if (emitter.frT > 0.5){ emitter.frT = 0; emitter.fr = (emitter.fr + 1) % emitter.E.frames.length; } } return; }
  applyInput(dt); if (state !== 'play') return;
  const mx = PX(), my = py, dx = worldSpeed()*dt;
  inv = Math.max(0, inv - dt);
  if (phase === 'fly'){ addPoll(P.pollLevel/P.flight*dt); nextSpawn -= dt; if (nextSpawn <= 0) spawn(); nextOrb -= dt; }   // les sondages montent avec la distance, pendant le vol
  else if (phase === 'storm') updateStorm(dt);
  updateChain(dt);
  if (phase === 'fly' && nextOrb <= 0){ addOrb(VWW + 40); const b = newBlock(); coinLine(VWW + 40 + sec(0.3), P.yMax, 20, b); coinLine(VWW + 40 + sec(0.3), P.yMax - coinGap(), 20, b); nextOrb = P.orbEvery*(0.8 + rnd()*0.4); }
  for (const o of orbs){ if (o.alert > 0){ o.alert -= dt; continue; } o.x -= dx; if (!o.got && Math.hypot(o.x - mx, o.y - my) < 46){ o.got = true; stats.orbs++; addPoll(P.orbGain); pop('Actu d’argent +' + P.orbGain.toFixed(1).replace('.', ',') + ' pt', '#e8edf5', mx + 10, my - 60, true); sfxP3('catch'); fx.push({kind: 'flash', x: o.x, y: o.y, t: 0}); } }
  orbs = orbs.filter(o => !o.got && o.x > -80);
  // pièces
  for (const c of coinsList){ c.x -= dx; if (!c.got && Math.hypot(c.x - mx, c.y - my) < 30*coinK()){ c.got = true; c.block.got++; coins++; stats.coins++;
      coinChain = (realT - coinChainT < 0.4) ? coinChain + 1 : 0; coinChainT = realT; sfxP3('coin', Math.min(coinChain, 10));
      fx.push({kind: 'spark', x: c.x, y: c.y, t: 0}); } }
  coinsList = coinsList.filter(c => !c.got && c.x > -40);
  // journalistes
  for (const j of journos){
    if (j.alert > 0){ j.alert -= dt; if (j.alert <= 0) sfxP3('alert'); continue; }   // l'hélico prévient avant d'entrer
    j.x -= dx + (j.vx || 0)*dt;
    if (j.track > 0){ j.track -= dt; j.y += clamp(my - j.y, -130*dt, 130*dt); }
    const cy = j.kind === 'boat' ? j.y - 30 : j.y;
    if (inv <= 0 && Math.abs(j.x - mx) < j.w/2 + 22 && Math.abs(cy - my) < j.h/2 + 28){
      inv = P.hitInv; stats.hits++; addPoll(-P.hitPoll); pop('−' + P.hitPoll.toFixed(1).replace('.', ',') + ' pt', '#d63b3b', mx + 10, my - 60, true); sfxP3('hit'); fx.push({kind: 'flash', x: j.x, y: cy, t: 0});
    }
  }
  journos = journos.filter(j => j.x > -160);
  for (const p of pops){ p.life -= dt; p.y -= 26*dt; } pops = pops.filter(p => p.life > 0);
  for (const f of fx) f.t += dt; fx = fx.filter(f => f.t < 0.5);
}

// ---------- la tempête : le scandale du niveau ----------
const curLevel = () => LEVELS[clamp(Math.round(P.level), 1, 5) - 1];
function startStorm(){
  const L = curLevel(), E = EMITTERS[L.scandal.emitter];
  phase = 'intro'; stormT = 0; bannerT = 0; nextSalvo = 1.2; nextBubble = 2.2; pans = []; bubbles = []; dark = 1; introT = 0;
  emitter = {kind: L.scandal.emitter, E, x: VWW - 230, tx: VWW - 230, y: E.y(), hits: 0, recoil: 0, pause: 0, fled: false, fr: 0, frT: 0};
  pointerDown = false; keyUp = false; sfxP3('wall');
}
let introT = 0;
function beginStormPlay(){ if (phase !== 'intro') return; phase = 'storm'; sfxP3('click'); }
function updateStorm(dt){
  stormT += dt; const mx = PX(), my = py, e = emitter;
  dark = Math.min(1, dark + dt/2); flash = Math.max(0, flash - dt*3); if (rnd() < dt*0.12) flash = 1;
  if (bannerT > 0) bannerT -= dt;
  cassInv = Math.max(0, cassInv - dt);
  // l'émetteur entre, recule aux touches, fuit à la fin
  if (e.fled){ e.x += 700*dt; if (e.x > VWW + 400){ endLevel('done'); return; } }
  else { e.x += clamp(e.tx + e.recoil - e.x, -500*dt, 500*dt); e.recoil = Math.max(0, e.recoil - 80*dt); e.pause = Math.max(0, e.pause - dt); }
  e.frT += dt; if (e.frT > 0.5){ e.frT = 0; e.fr = (e.fr + 1) % e.E.frames.length; }
  if (e.kind === 'bard') e.y += clamp(lerp(P.ceil, WATER, 0.45) + Math.sin(realT*0.8)*60 - e.y, -120*dt, 120*dt);   // Bardella se balade
  if (!e.fled && stormT >= P.stormMax){ e.fled = true; pop('Il s’en va…', '#e8edf5', e.x - 60, e.y - 120, true); }
  // les salves : des casseroles en arc vers Marine, étalées en hauteur
  // les lancers, un par un : tirs tendus horizontaux dans un couloir d'altitude (visé ou au hasard), ou retombées verticales sur la position de Marine ; chacun est annoncé par un repère pendant `telegraph` s

const LINK = 28;

function updateChain(dt){

  let px = ax, pyy = ay;

    // Verlet : la casserole garde son élan (amorti), tombe, et le vent relatif la pousse vers l'arrière
    const vx = (l.x - l.ox)*0.92, vy = (l.y - l.oy)*0.92; l.ox = l.x; l.oy = l.y;
    l.x += vx - 320*dt*dt; l.y += vy + 1400*dt*dt;
