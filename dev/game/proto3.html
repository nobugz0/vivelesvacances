<style>
/* Layout: one-screen landscape game. The world is pixel art (sprite sheets); every menu, card and HUD element is a sober, non-pixel UI. Single bright look by choice. */
:root{
  --ink:#1b1f2a; --muted:#5b6475; --paper:#ffffff; --line:#e3e7ee; --accent:#d63b3b; --blue:#2563eb; --green:#16a34a;
  --ui:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; --title:"Inter Tight",Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden}
body{position:fixed;inset:0;width:100%}
[hidden]{display:none!important}
body{background:#0f1d33;color:var(--ink);font-family:var(--ui);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{background:#0b1526}
#wrap{position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;transform-origin:0 0;background:#4a90d9}
canvas{display:block;width:100%;height:100%;touch-action:none}
.corner{position:absolute;top:30px;right:12px;display:flex;gap:8px;z-index:6}
.ib{width:34px;height:34px;border:2.5px solid #14213d;border-radius:4px;background:#fff;box-shadow:none;cursor:pointer;display:grid;place-items:center;color:var(--ink);padding:0}
.ib:hover{background:#fff}
.ib:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ib svg{width:20px;height:20px}
.ib img{width:24px;height:24px;object-fit:contain;display:block}
@media (pointer: coarse){ .corner{gap:10px} .ib{width:38px;height:38px} .ib svg{width:19px;height:19px} .ib img{width:24px;height:24px} }
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-inline:16px;background:rgba(15,29,51,.4);z-index:4}
.card{background:#fffaf0;border:3px solid #1b2433;border-radius:10px;box-shadow:7px 7px 0 #1b2433;max-width:520px;width:100%;max-height:calc(100% - 28px);overflow:auto;padding:26px 28px;display:flex;flex-direction:column;gap:12px;text-align:center;box-sizing:border-box}
.logo{font-weight:800;font-size:clamp(2rem,6.5vw,3rem);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
.card p{margin:0;font-size:1.05rem;line-height:1.4;color:var(--ink)}
.card .small{font-size:.85rem;color:var(--muted)}
.tiles{display:flex;gap:12px;justify-content:center}
.tile{flex:1;min-width:0;background:#fff;border:3px solid #1b2433;border-radius:8px;box-shadow:4px 4px 0 #1b2433;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile svg{width:30px;height:30px}
.tile b{font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.card .score{font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.actions{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.big{font-family:var(--ui);font-weight:800;font-size:1.15rem;background:var(--ink);color:#fff;border:3px solid #1b2433;border-radius:8px;box-shadow:4px 4px 0 #1b2433;padding:11px 28px;cursor:pointer}
.big:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1b2433}
.big.go{background:var(--green)}
.big.go:hover{background:#12873d}
.big:not(.go):hover{background:#2c3446}
.tuto{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;cursor:pointer;padding:8px 14px;border:3px solid #1b2433;border-radius:8px;background:#fff;box-shadow:4px 4px 0 #1b2433}
.tuto input{width:18px;height:18px;accent-color:var(--green);margin:0}
button.tuto{font-family:var(--ui);color:var(--ink)}
.tuto svg{width:18px;height:18px}
.levels{display:inline-flex;border:3px solid #1b2433;border-radius:8px;box-shadow:4px 4px 0 #1b2433;overflow:hidden;background:#fff}
.levels button{font-family:var(--ui);font-weight:800;font-size:.95rem;border:0;background:#fff;color:var(--ink);padding:8px 12px;cursor:pointer}
.levels button+button{border-left:2px solid #1b2433}
.levels button[aria-pressed="true"]{background:var(--ink);color:#fff}
#debug select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px 6px}
/* title and end screens: the illustration is laid out in image pixels (u = one image pixel), the card covers the painted one */
.screen{position:absolute;inset:0;z-index:4;overflow:hidden;background:#0f1d33}
.sbg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(18px) brightness(.8)}
.stage{position:absolute;--u:1px}
.stage>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.scard{position:absolute;box-sizing:border-box;background:#fffaf0;border:calc(var(--u)*6) solid #14213d;border-radius:calc(var(--u)*16);box-shadow:calc(var(--u)*10) calc(var(--u)*10) 0 rgba(20,26,40,.85);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;color:#14213d}
.scard h1{margin:0;line-height:1.05;letter-spacing:-.01em}
.scard p{margin:0}
.s-start{padding:calc(var(--u)*34) calc(var(--u)*30) calc(var(--u)*26)}
.s-start h1{font-family:var(--title);font-weight:900;font-size:calc(var(--u)*112);color:#13234a;text-shadow:0 calc(var(--u)*-3) 0 #f2b630,calc(var(--u)*3) 0 0 #f2b630,0 calc(var(--u)*3) 0 #f2b630,calc(var(--u)*-3) 0 0 #f2b630,calc(var(--u)*6) calc(var(--u)*6) 0 rgba(20,26,40,.35)}
.s-start #tSub{font-family:var(--ui);font-weight:700;font-size:calc(var(--u)*40);line-height:1.25;max-width:calc(var(--u)*980)}
.s-end{padding:calc(var(--u)*30) calc(var(--u)*30) calc(var(--u)*30)}
.s-end h1{font-family:var(--title);font-weight:900;font-size:calc(var(--u)*70)}
.ssub{font-size:calc(var(--u)*28);font-weight:600;color:#5b6475}
.ssub:empty{display:none}
.srow{display:flex;gap:calc(var(--u)*22);align-items:stretch;justify-content:center;width:100%}
.sbtn{white-space:nowrap;font-family:var(--ui);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--u)*14);background:#fff;color:#14213d;border:calc(var(--u)*5) solid #14213d;border-radius:calc(var(--u)*12);box-shadow:calc(var(--u)*6) calc(var(--u)*6) 0 #14213d;cursor:pointer;padding:0 calc(var(--u)*26);box-sizing:border-box}
.sbtn:active{transform:translate(calc(var(--u)*4),calc(var(--u)*4));box-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 #14213d}
.sbtn.go{background:#22a447;color:#fff}
.sbtn.ic{padding:0;aspect-ratio:1/1}
.s-start .sbtn.ic{width:calc(var(--u)*116)}
.s-end .sbtn.ic{width:calc(var(--u)*86)}
.sbtn.go:hover{background:#1c8f3d}
.sbtn svg{width:calc(var(--u)*44);height:calc(var(--u)*44)}
.sbtn input{width:calc(var(--u)*40);height:calc(var(--u)*40);accent-color:#22a447;margin:0}
.s-start .sbtn{font-family:var(--ui);font-size:calc(var(--u)*44);height:calc(var(--u)*116);font-weight:800}
.s-start .sbtn.go{font-size:calc(var(--u)*56);min-width:calc(var(--u)*390);font-weight:700}
.s-start .srow.tests{gap:calc(var(--u)*14)}
.s-start .sbtn.sm{font-size:calc(var(--u)*26);height:calc(var(--u)*64);padding:0 calc(var(--u)*18);box-shadow:calc(var(--u)*4) calc(var(--u)*4) 0 #14213d}
.s-end .srow{gap:calc(var(--u)*16)}
.s-end .sbtn{font-size:calc(var(--u)*30);height:calc(var(--u)*86);padding:0 calc(var(--u)*18);gap:calc(var(--u)*10)}
.s-end .sbtn svg{width:calc(var(--u)*38);height:calc(var(--u)*38)}
.s-end .sbtn input{width:calc(var(--u)*34);height:calc(var(--u)*34)}
.s-end .sbtn.go{font-size:calc(var(--u)*40);min-width:calc(var(--u)*270)}
.srec{font-size:calc(var(--u)*30);font-weight:600;color:#3d5a8a}
.s-start .srec{font-family:var(--ui)}
.srec:empty{visibility:hidden}
.stiles{display:flex;gap:calc(var(--u)*22);width:100%;justify-content:center}

  const t = d.pop(); decks['last:' + name] = [t].concat(last).slice(0, 2); return t;

let settingsSrc = 'défaut';
function loadLocal(){ try { const j = JSON.parse(localStorage.getItem('p3-settings') || 'null'); if (j){ applySettings(j); settingsSrc = 'cet appareil'; } } catch(e){} }
function applySettings(j){ for (const sp of PSPEC) if (typeof j[sp.k] === 'number') P[sp.k] = clamp(j[sp.k], sp.min, sp.max); applyCam(); }   // le mode de commande n'est plus chargé : toujours l'appui
function settingsJson(){ const j = {ctrl}; for (const sp of PSPEC) j[sp.k] = P[sp.k]; return j; }
let dbDoc = null;
async function loadShared(){
  try {
    if (!window.claude || !window.claude.use) return;
    const db = await window.claude.use('db'); if (!db) return;
    await loadCampShared(db);
    dbDoc = db.doc('settings/main'); const snap = await dbDoc.get();
    if (snap.exists){ applySettings(snap.data()); settingsSrc = 'artifact'; debugRefresh(); }
  } catch(e){ dbDoc = null; }
}
async function saveSettings(){
  const j = settingsJson(); let msg = 'Enregistré sur cet appareil';
  try { localStorage.setItem('p3-settings', JSON.stringify(j)); } catch(e){}
  if (dbDoc){ try { await dbDoc.set(j); msg = 'Enregistré dans l’artifact (tous les appareils)'; } catch(e){ msg = 'Enregistré sur cet appareil ; l’artifact a refusé (' + (e && e.code || 'erreur') + ')'; } }
  return msg;
}

let card = null, cardT = 0, mBubble = null, cruiseT = 0, tutoSeen = {};
function showCard(kind, o){ card = Object.assign({kind}, o || {}); cardT = 0; pointerDown = false; keyUp = false; holding = false; sfxP3('wall'); if (kind === 'theme') sting('sting_carton'); else if (kind === 'position') sting('sting_voltface'); else if (kind === 'scandal') sting('sting_scandale'); }   // les confettis de la volte-face viennent en dernier, dans la carte
function closeCard(){ const c = card; if (!c) return; card = null; sfxP3('click'); pressed = null; if (c.kind === 'scandal') beginStormPlay(); else if (c.kind === 'vane') startChase(); else if (c.kind === 'position') afterChase(); }

// ---------- campagne : progression, sauvegarde, bonus ----------
// mode 'camp' = la campagne (carte, niveaux, sauvegarde) ; 'test' = les boutons de test du menu (niveau P.level, rien n'est sauvegardé)
let mode = 'test', levelN = 1, testMode = '', kevlarLeft = 0, infoOpen = null, shopMsg = '';
const hasBonus = id => mode === 'camp' && !!(camp.bonuses && camp.bonuses[id]);   // les bonus activés valent pour le niveau en cours (gardés si on le recommence)
const ORDER = [0, 4, 1, 2, 3, 5];   // séquence k → fiche LEVELS[ORDER[k]] : le tuto, puis Inéligibilité, Europe, Retraites, Énergie, Budget
const curLevel = () => LEVELS[ORDER[clamp(levelN, 0, 5)]];
const isTuto = () => levelN === 0;
const flightDur = () => isTuto() ? P.tutoFlight : P.flight*lvlDur();
// camp.levels[n] = {entry: {poll, cass} (état à l'entrée du niveau), done, poll, cass, gold, hits} ; unlocked = nombre de chapitres jouables (tuto compris)
function newCampaign(){ return {v: 1, ts: 0, unlocked: 2, coins: 0, cur: 0, votes: 0, levels: [], bonuses: {}}; }
let camp = newCampaign();
const levelEntry = n => (camp.levels[n] && camp.levels[n].entry) || {poll: P.pollStart};
const playable = n => n < camp.unlocked;
let campDoc = null;
function loadCampLocal(){ try { const j = JSON.parse(localStorage.getItem('p3-campaign') || 'null'); if (j && j.v === 1) camp = j; } catch(e){} }
async function loadCampShared(db){
  try { campDoc = db.doc('campaign/main'); const s = await campDoc.get(); if (s.exists){ const j = s.data(); if (j && j.v === 1 && (j.ts || 0) > (camp.ts || 0)){ camp = j; syncTitle(); } } } catch(e){ campDoc = null; }
}
async function saveCamp(){
  camp.ts = Date.now(); const j = JSON.parse(JSON.stringify(camp));
  try { localStorage.setItem('p3-campaign', JSON.stringify(j)); } catch(e){}
  if (campDoc){ try { await campDoc.set(j); } catch(e){} }
}
function resetCamp(){ camp = newCampaign(); saveCamp(); }
function unlockAll(){ camp.unlocked = 6; saveCamp(); }   // (sans effet sur l'enchaînement ; gardé pour les tests)
const votePrice = () => Math.round(P.votePrice*Math.pow(1.5, camp.votes || 0));
function buyVotes(){
  const pr = votePrice(); if (camp.coins < pr) return false;
  camp.coins -= pr; camp.votes = (camp.votes || 0) + 1;
  const e = levelEntry(levelN); camp.levels[levelN] = Object.assign(camp.levels[levelN] || {}, {entry: {poll: clamp(e.poll + P.voteGain, 0, 100)}});
  saveCamp(); return true;
}
function buyBonus(id){
  const b = BONUS.find(x => x.id === id); if (!b) return false;
  if (!camp.bonuses) camp.bonuses = {};
  if (camp.bonuses[id] || camp.coins < b.price) return false;
  camp.coins -= b.price; camp.bonuses[id] = true; saveCamp(); return true;
}
function sellBonus(id){ const b = BONUS.find(x => x.id === id); if (!b || !camp.bonuses || !camp.bonuses[id]) return false; delete camp.bonuses[id]; camp.coins += b.price; saveCamp(); return true; }   // un clic sur un bonus activé le rend et rembourse

function start(){
  camFx = 1; camGoal = 1; applyCam(); seed = 7; realT = 0; tFlight = 0; py = P.yMax; vy = 0; aIn = 0; aVane = 0; holding = false; holdT = relT = 0; inv = 0; onWater = true; endReason = ''; wind = 1; windEmptyT = -9;
  phase = 'fly'; card = null; mBubble = null; sinkAt = -1; hitT = panT = pointT = bargeT = landT = remountT = hitFlash = 0; cruiseT = 0; tutoSeen = {}; tutoStage = 0; tutoBoats = 0; tutoEtr = 0; tutoEtrN = 0; tutoPat = 0; boatN = 0; lastAir = null; decks = {}; lastQ = null; lastPhrase = null; qLog = []; stormT = 0; emitter = null; pans = []; bubbles = []; cass = 0; chase = null; trail = []; marineX = null; nextSalvo = 0; nextBubble = 0; dark = 0; bannerT = 0; flash = 0; panInv = 0; booth = null; infoOpen = null; gate = null; nextEtr = 4 + rnd()*3; confetti = []; shakeT = 0;
  poll = P.pollStart; coins = 0; stats = {hits: 0, coins: 0, cass: 0, etr: 0, bubbles: 0, gold: false, kevlar: 0, themeBoats: 0};
  coinsList = []; journos = []; pops = []; fx = []; nextSpawn = 1.2; coinChain = 0; coinChainT = -9; sea = 'cote'; spawnI = 0; patOrder = [];
  pointerY = null; pointerDown = false; keyUp = keyDown = false;
  if (mode === 'camp'){
    // on repart de l'état d'entrée du niveau (sondages et casseroles accumulés), avec le bonus choisi
    const e = levelEntry(levelN); poll = e.poll;
    kevlarLeft = hasBonus('kevlar') ? KEVLAR_HITS : 0;
    if (isTuto()) showCard('msg', {title: 'Planer', wide: true, text: 'Appuie pour monter, relâche pour redescendre !', skip: true, img: IMG.tuto[0]});
  } else kevlarLeft = 0;
  fallen = poll < P.pollFall; pollShow = poll;
  if (!isTuto()){ nextSpawn = 1.4; nextEtr = 6 + rnd()*3; }   // 03/11 : plus de carton de début de séquence (le thème arrive avec le carton de la volte-face)   // le carton du thème ouvre la séquence (le mot en pièces de 0.21 n'était pas lisible)
  state = 'play'; paused = false;
  document.getElementById('titleScreen').hidden = true;
  ensureAudio(); musicStart();
}
function startLevel(n){ mode = 'camp'; levelN = clamp(n, 0, 5); camp.cur = levelN; testMode = ''; start(); }
function startTestFly(){ mode = 'test'; levelN = clamp(Math.round(P.level), 1, 5); testMode = 'fly'; start(); }
function startFreeFly(){ mode = 'test'; levelN = 1; testMode = 'free'; start(); }   // debug : des pièces, aucun obstacle, pas de fin
function startTest(){ mode = 'test'; levelN = clamp(Math.round(P.level), 1, 5); testMode = 'storm'; start(); startStorm(true); }
function startTestChase(){ mode = 'test'; levelN = clamp(Math.round(P.level), 1, 5); testMode = 'chase'; start(); startChase(); }
function replay(){ if (mode === 'camp') startLevel(levelN); else if (testMode === 'storm') startTest(); else if (testMode === 'chase') startTestChase(); else if (testMode === 'free') startFreeFly(); else startTestFly(); }
function toTitle(){ if (mode === 'camp' && state !== 'title') saveCamp(); state = 'title'; infoOpen = null; musicStop(); syncTitle(); document.getElementById('titleScreen').hidden = false; document.getElementById('ttests').hidden = true; }
// l'écran des bonus, entre deux chapitres : réserve, voix, bonus à activer, « C'est parti ». Le tuto démarre sans écran.
function goInter(n){
  mode = 'camp'; levelN = clamp(n, 0, 5); camp.cur = levelN; shopMsg = ''; infoOpen = null; interStep = 1; interT = 0; coinBump = 0;
  if (levelN === 0){ startLevel(0); return; }

}

// ---------- commandes ----------
function inputFromPointer(ly){ const raw = clamp((H/2 - ly)/(H*P.windRange/200), -1, 1); return Math.sign(raw)*Math.pow(Math.abs(raw), P.windCurve); }
// Un pas du modèle « appui » : st = {vy, holdT, relT}, modifié en place.
// Accélérations dérivées : la montée part à 35 % et atteint 100 % en tUp (la vitesse max arrive alors exactement à tUp) ; la gravité part à 25 % et atteint 100 % en tDown.
function tapStep(st, hold, dt){
  const aUp = P.vUp/(0.675*P.tUp), aDown = P.vDown/(0.625*P.tDown), brake = Math.max(P.vUp, P.vDown)/P.tTurn;
  if (hold){
    st.relT = 0;
    if (st.vy > 0){ st.vy = Math.max(0, st.vy - brake*dt); st.holdT = 0; }   // on appuie en descente : inversion d'abord
    else { st.holdT += dt; const a = aUp*lerp(0.35, 1, clamp(st.holdT/P.tUp, 0, 1)); st.vy = Math.max(-P.vUp, st.vy - a*dt); }
  } else {
    st.holdT = 0;
    if (st.vy < 0){ st.vy = Math.min(0, st.vy + brake*dt); st.relT = 0; }   // on relâche en montée : la montée s'annule
    else { st.relT += dt; if (st.relT >= P.glide){ const a = aDown*lerp(0.25, 1, clamp((st.relT - P.glide)/P.tDown, 0, 1)); st.vy = Math.min(P.vDown, st.vy + a*dt); } }   // sinon : plané
  }
}
function applyInput(dt){
  if (ctrl === 'tap'){
    const want = pointerDown || keyUp;
    // réserve de vent : l'appui consomme (sauf sur l'eau), la glisse sur l'eau recharge ; vide, l'appui ne répond plus
    // pendant la course, le vol est infini : Marine est portée par le scandale qu'elle vient de traverser (planche d'argent)
    { if (want && !onWater){ wind = Math.max(0, wind - dt/(P.windCap*(hasBonus('fire') ? 2 : 1)));   /* plan ventilateur : la réserve dure deux fois plus */ if (wind === 0 && windEmptyT < 0){ windEmptyT = realT; sfxP3('down'); } }
      if (onWater) wind = Math.min(1, wind + dt/P.windRefill); }
    if (wind > 0) windEmptyT = -9;
    holding = want && (wind > 0 || onWater) && !(chase && chase.leaving);   // quand l'actu s'envole, Marine retombe
    const st = {vy, holdT, relT}; tapStep(st, holding, dt); vy = st.vy; holdT = st.holdT; relT = st.relT;
  } else {
    if (pointerDown && pointerY !== null) aIn = inputFromPointer(pointerY);
    else if (keyUp || keyDown) aIn = clamp(aIn + ((keyUp ? 1 : 0) - (keyDown ? 1 : 0))*3*dt, -1, 1);
    // doigt levé : la direction donnée se maintient
    const rate = 2/Math.max(0.02, P.windLag);   // la girouette parcourt un demi-tour (2 unités) en windLag s
    aVane += clamp(aIn - aVane, -rate*dt, rate*dt);
    const a = Math.abs(aVane) < P.windDead/100 ? 0 : aVane;
    vy = -a*P.windV;
  }
  const vyBefore = vy;
  py += vy*dt;
  if (py < P.ceil){ py = P.ceil; if (vy < 0) vy = 0; }   // le plafond borne le vol, sans sanction
  if (py >= P.yMax){
    py = P.yMax; if (vy > 0) vy = 0;
    if (!onWater){ sfxP3('plouf'); fx.push({kind: 'splash', x: PX(), y: WATER, t: 0, big: vyBefore > 300}); onWater = true; wind = Math.max(wind, P.windMin/100); }
  } else if (onWater && py < P.yMax - 2) onWater = false;
}

  if (e.repeat) return;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') keyUp = true;

// ---------- génération du vol ----------
// Chaque motif est posé à droite de l'écran (x = VW + marge) et défile vers la gauche.
// Les pièces grossissent un peu quand la caméra recule, pour rester lisibles à l'écran
const coinK = () => clamp(Math.sqrt(0.8/Z)*1.15, 1, 2), coinR = () => P.coinR*coinK(), coinGap = () => P.coinGap*coinK();
const COIN_TOP = () => P.ceil + 40;   // les pièces restent un peu sous le plafond
// le mot du chapitre écrit en pièces : on rend le mot sur un canevas, on échantillonne une grille de 6 lignes, une pièce par case pleine
function coinWord(word, x0, yMid){
  const c = document.createElement('canvas'); c.width = 1600; c.height = 96; const g = c.getContext('2d'); g.font = '900 112px ' + UI; g.textBaseline = 'middle'; g.fillStyle = '#000'; g.fillText(word, 6, 50);
  const w = Math.min(c.width, Math.ceil(g.measureText(word).width) + 12), rows = 6, cell = c.height/rows, cols = Math.ceil(w/cell), d = g.getImageData(0, 0, c.width, c.height).data, b = newBlock();
  for (let i=0;i<cols;i++) for (let j=0;j<rows;j++){ const sx = Math.min(c.width - 1, Math.floor((i + 0.5)*cell)), sy = Math.floor((j + 0.5)*cell); if (d[(sy*c.width + sx)*4 + 3] > 100) addCoin(x0 + i*coinGap(), yMid + (j - rows/2 + 0.5)*coinGap(), b); }
  return cols*coinGap();
}
function addCoin(x, y, block){ if (y < COIN_TOP() || y > P.yMax + 10) return; coinsList.push({x, y, r: coinR(), block, ph: rnd()*6.3}); block.n++; }
function newBlock(){ const b = {n: 0, got: 0, done: false}; return b; }
function coinLine(x0, y, n, b){ for (let i=0;i<n;i++) addCoin(x0 + i*coinGap(), y, b); return x0 + n*coinGap(); }
function coinRect(x0, y0, cols, rows, b){ for (let i=0;i<cols;i++) for (let j=0;j<rows;j++) addCoin(x0 + i*coinGap(), y0 + j*coinGap(), b); return x0 + cols*coinGap(); }
// Trajectoire simulée avec le modèle de vol courant : schedule = [[appui ?, durée en s], ...] depuis l'altitude y0, stationnaire.
// Renvoie des points espacés de coinGap() en x ; sert à poser des pièces exactement là où un vol naturel passe.
function simPath(y0, schedule){
  const st = {vy: 0, holdT: 0, relT: 0}, pts = [], dt = 1/120, vx = worldSpeed(); let y = y0, x = 0, nextX = 0;
  for (const [hold, dur] of schedule){ for (let t = 0; t < dur; t += dt){ tapStep(st, hold, dt); y = clamp(y + st.vy*dt, COIN_TOP(), P.yMax); if (y === P.yMax && st.vy > 0) st.vy = 0; x += vx*dt; if (x >= nextX){ pts.push([x, y]); nextX += coinGap(); } } }
  return pts;
}
// rows = nombre de lignes parallèles (empilées vers le bas) ; 1 à 3
function coinPath(x0, pts, b, from, to, rows){ const a = from || 0, z = to === undefined ? pts.length : to, n = rows || nRows(); for (let i = a; i < z; i++) for (let r = 0; r < n; r++) addCoin(x0 + pts[i][0], pts[i][1] + r*coinGap(), b); return x0 + (pts.length ? pts[pts.length - 1][0] : 0) + coinGap(); }
function nRows(){ const h = rnd(); return h < 0.4 ? 1 : h < 0.8 ? 2 : 3; }   // 1 à 3 rangées, jamais plus
function coinLines(x0, y, n, b, rows){ const r = rows || nRows(); for (let k = 0; k < r; k++) coinLine(x0, y + k*coinGap(), n, b); return x0 + n*coinGap(); }
const sec = t => t*worldSpeed();   // secondes de vol -> px monde
const BANDS = () => ({low: [WATER - 110, WATER - 70], mid: [lerp(P.ceil, WATER, 0.5) - 40, lerp(P.ceil, WATER, 0.5) + 40], high: [COIN_TOP() + 30, COIN_TOP() + 110], bait: [COIN_TOP(), COIN_TOP() + 16]});
const bandY = k => { const b = BANDS()[k]; return lerp(b[0], b[1], rnd()); };
let boatN = 0, tutoStage = 0, tutoBoats = 0, tutoEtr = 0, tutoEtrN = 0, tutoPat = 0, lastAir = null;   // barques posées (une sur trois porte le thème) ; étape du tuto (0 pièces, 1 journalistes, 2 étrangers) ; barques passées au tuto ; archétype volant du dernier motif
function addBoat(x){ boatN++; const theme = false; /* le bateau du thème n'est plus un obstacle : il suit Marine en fond */ if (theme) stats.themeBoats++; journos.push({kind: 'boat', theme, crew: Math.floor(rnd()*3), x, y: WATER - 2, w: 166, h: 116, fr: Math.floor(rnd()*6), bob: rnd()*6, q: theme ? null : journoQ()}); }
// archétypes disponibles selon le chapitre : barques toujours, puis deltaplanes (1), hélicos (2), trampolinistes (3), jet-skis (4)
const allowed = kind => kind === 'boat' || (kind === 'glider' && levelN >= 1) || (kind === 'heli' && levelN >= 1) || (kind === 'tramp' && levelN >= 2) || (kind === 'jet' && levelN >= 3);   // 03/11 : séquence 1 delta et hélico fixe, 2 trampoline et hélico mobile, 3 jet-ski
function addGlider(x, y){ if (!allowed('glider')) return addBoat(x); journos.push({kind: 'glider', x, y, w: 166, h: 92, bob: rnd()*6, col: pick(['#e3342f', '#c81e1e', '#ff5a5f']), q: journoQ()}); }
// le trampoliniste : une barque avec un trampoline ; il s'accroupit (préavis) puis saute haut, à période fixe
function addTramp(x){ journos.push({kind: 'tramp', x, y: WATER - 2, w: 84, h: 100, fr: Math.floor(rnd()*6), bob: rnd()*6, ph: rnd()*2.4, jy: 0, q: journoQ()}); }
// le jet-ski : arrive vite au ras de l'eau, se cale sous Marine pendant jetFollow s (interdit la pose), puis file
function addJet(x){ journos.push({kind: 'jet', x, y: WATER - 8, w: 132, h: 66, bob: rnd()*6, alert: 1.1, st: 'in', vx: 520, holdT: 0, q: journoQ()}); }
function addHeli(x, y, track){ if (!allowed('heli')) return addGlider(x, y); journos.push({kind: 'heli', x, y, y0: y, w: 150, h: 84, bob: rnd()*6, track: track ? 4.8 : 0, alert: track ? 0.9 : 0, vx: track ? worldSpeed()*0.55 : 0, q: journoQ()}); }
// l'étranger (dans la bouche de Marine) : un passant sur une planche de surf ou un petit bateau, au ras de l'eau ; la frapper le fait tomber à l'eau et rapporte des sondages
function addEtr(x){ coinsList = coinsList.filter(cn => Math.abs(cn.x - x) >= 70); journos.push({kind: 'etr', ch: Math.floor(rnd()*6), x, y: WATER - 2, w: 66, h: 92, bob: rnd()*6, surf: rnd() < 0.6, col: pick(['#2563eb', '#38bdf8', '#0ea5e9', '#1d4ed8']), q: null, cried: false, fall: -1}); }
const worldSpeed = () => P.speed/Z;   // la vitesse se règle en px écran/s ; en px monde elle dépend de la caméra
// Chaque motif reçoit x (bord droit du monde) et renvoie sa longueur en px monde. Les durées sont en secondes de vol, les altitudes relatives à la limite et à l'eau.
const PATTERNS = [
  // 1. montée naturelle : depuis le ras de l'eau, un appui tenu 0,8 s puis relâché ; une barque sous le départ oblige à décoller
  x => { const pts = simPath(WATER - 90, [[true, 0.8], [false, 0.5]]); const b = newBlock(); coinPath(x + sec(0.3), pts, b); addBoat(x + sec(0.9)); return sec(1.3) + pts[pts.length - 1][0]; },
  // 2. piqué naturel : depuis le haut, relâche 0,7 s puis appui 0,45 s (ressource) ; un deltaplane attend au fond du creux, juste après
  x => { const y0 = COIN_TOP() + 60, pts = simPath(y0, [[false, 0.7], [true, 0.45]]); const b = newBlock(); coinPath(x, pts, b); const low = pts.reduce((m, q) => Math.max(m, q[1]), 0); addGlider(x + pts[pts.length - 1][0] + sec(0.45), low); return pts[pts.length - 1][0] + sec(1.0); },
  // 3. vague : appui 0,4 s / relâche 0,5 s trois fois, depuis le milieu ; une barque sous le dernier creux
  x => { const y0 = lerp(COIN_TOP(), WATER, 0.55), pts = simPath(y0, [[true, 0.4], [false, 0.5], [true, 0.4], [false, 0.5], [true, 0.4], [false, 0.5]]); const b = newBlock(); coinPath(x, pts, b); addBoat(x + pts[pts.length - 1][0] - sec(0.2)); return pts[pts.length - 1][0] + sec(0.8); },
  // 4. le piège hélico : un ruban en haut, l'hélico traqueur attend juste au bout
  x => { const y = bandY('high'), b = newBlock(); coinLines(x, y, 14, b, 2); addHeli(x + 14*coinGap() + sec(0.3), y + coinGap()/2, true); return 14*coinGap() + sec(1.6); },
  // 5. escalier : trois paliers ; l'écart entre paliers = le temps d'un appui de 0,35 s dans le modèle courant
  x => { const st = simPath(lerp(COIN_TOP(), WATER, 0.7), [[true, 0.35], [false, 0.05]]), dy = st[0][1] - st[st.length - 1][1], dx = st[st.length - 1][0]; let y = lerp(COIN_TOP(), WATER, 0.7), xx = x; const b = newBlock(), r = nRows();
    for (let k=0;k<3;k++){ coinLines(xx, y, 6, b, r); xx += 6*coinGap() + dx; y -= dy; } addBoat(x + sec(0.4)); return xx - x + sec(0.6); },
  // 6. rampe : un piqué qui finit au ras de l'eau (relâche jusqu'à la pose), puis une barque pour redécoller
  x => { const pts = simPath(lerp(COIN_TOP(), WATER, 0.5), [[false, 2.5]]); let n = pts.findIndex(q => q[1] >= P.yMax - 2); if (n < 0) n = pts.length; const b = newBlock(); coinPath(x, pts, b, 0, n, 2); const xe = x + pts[Math.max(0, n - 1)][0]; addBoat(xe + sec(1.2)); return pts[Math.max(0, n - 1)][0] + sec(1.9); },
  // 7. couloir : un ruban au milieu, des barques dessous toutes les 1,1 s, un hélico traqueur au-dessus
  x => { const y = bandY('mid'), b = newBlock(); coinLines(x, y, 24, b); addBoat(x + sec(0.2)); addBoat(x + sec(1.3)); addHeli(x + sec(0.5), COIN_TOP() + 50, true); return 24*coinGap() + sec(0.8); },
  // 8. l'appât : un ruban juste sous la zone interdite aux pièces, puis un deltaplane juste dessous : descendre vite ou monter mourir
  x => { const b = newBlock(); coinLines(x, bandY('bait'), 16, b, 3); addGlider(x + 16*coinGap() + sec(0.4), COIN_TOP() + 90); return 16*coinGap() + sec(1.2); },
  // 9. saute-barques : un ruban au ras de l'eau (on glisse et on recharge), trois barques espacées de 1,2 s à sauter
  x => { const b = newBlock(); coinLines(x, P.yMax - coinGap(), 36, b, 2); addBoat(x + sec(0.3)); addBoat(x + sec(1.5)); addBoat(x + sec(2.7)); return 36*coinGap() + sec(0.6); },
  // 13. la glisse : un long ruban sur l'eau sans obstacle, pour recharger et ramasser ; un hélico fixe en haut pour ceux qui voudraient rester en l'air
  x => { const b = newBlock(); coinLines(x, P.yMax - coinGap(), 30, b, 3); addHeli(x + sec(0.8), COIN_TOP() + 80, false); return 30*coinGap() + sec(0.8); },
  // 14. le tremplin : glisse sur l'eau, puis une barque, puis une montée naturelle (appui 0,9 s) qui part juste après la barque
  x => { const b = newBlock(); coinLines(x, P.yMax - coinGap(), 12, b, 2); addBoat(x + 12*coinGap() + sec(0.35)); const pts = simPath(P.yMax - 10, [[true, 0.9], [false, 0.6]]); coinPath(x + 12*coinGap() + sec(0.75), pts, b); return 12*coinGap() + sec(0.75) + pts[pts.length - 1][0] + sec(0.6); },

  x => { const y = bandY('mid'), b = newBlock(); addGlider(x, y + 1.5*coinGap()); coinRect(x + sec(0.5), y, 8, 3, b); addGlider(x + sec(0.5) + 8*coinGap() + sec(0.45), y + coinGap()); return sec(1.0) + 8*coinGap() + sec(0.8); },
  // 11. montée en deux temps : deux appuis de 0,3 s séparés par une relâche de 0,3 s, depuis le bas ; un hélico fixe guette en haut
  x => { const pts = simPath(WATER - 100, [[true, 0.3], [false, 0.3], [true, 0.3], [false, 0.4]]); const b = newBlock(); coinPath(x, pts, b); addHeli(x + pts[pts.length - 1][0] + sec(0.5), pts[pts.length - 1][1] - 20, false); return pts[pts.length - 1][0] + sec(1.3); },

  x => { const y = lerp(COIN_TOP(), WATER, 0.45), b = newBlock(); coinRect(x, y, 7, 3, b); return 7*coinGap() + sec(0.8); },

  x => { const b = newBlock(); coinLines(x, bandY('mid'), 18, b); addTramp(x + sec(0.5)); addTramp(x + sec(1.7)); return 18*coinGap() + sec(1.0); },

  x => { const b = newBlock(); coinLines(x, P.yMax - coinGap(), 14, b, 2); addBoat(x + 14*coinGap() + sec(0.25)); return 14*coinGap() + sec(1.2); },

const PAT_NEED = {14: 'tramp', 15: 'jet'};
const PAT_GLIDER = [1, 7, 9, 16], PAT_HELI = [3, 6, 10, 12];   // motifs qui posent un deltaplane / un hélico (l'hélico devient deltaplane avant la séquence 2, le deltaplane barque au tuto)
const airKind = i => PAT_GLIDER.includes(i) ? (allowed('glider') ? 'glider' : null) : PAT_HELI.includes(i) ? (allowed('heli') ? 'heli' : allowed('glider') ? 'glider' : null) : null;
let patOrder = [];
function spawn(){
  const x = VWW + 60;
  if (!patOrder.length){ patOrder = PATTERNS.map((_, i) => i).filter(i => !PAT_NEED[i] || allowed(PAT_NEED[i])); for (let i = patOrder.length - 1; i > 0; i--){ const j = Math.floor(rnd()*(i + 1)); [patOrder[i], patOrder[j]] = [patOrder[j], patOrder[i]]; } }
  // jamais deux motifs de suite avec le même archétype volant : on remonte le premier motif du paquet qui en change
  const top = patOrder.length - 1; if (lastAir && airKind(patOrder[top]) === lastAir) for (let k = top - 1; k >= 0; k--) if (airKind(patOrder[k]) !== lastAir){ [patOrder[k], patOrder[top]] = [patOrder[top], patOrder[k]]; break; }
  const pi = patOrder.pop(), n0 = journos.length, c0 = coinsList.length; let w = PATTERNS[pi](x);   // chaque motif passe une fois avant qu'un ne revienne
  // fin de vol : un motif qui ne pourrait pas dépasser Marine avant la girouette ne part pas (l'écran se vide avant la phase suivante)
  if (!(isTuto() && mode === 'camp') && (w + x - PX())/worldSpeed() + 0.4 > flightDur() - tFlight){ journos.length = n0;   // le tuto, lui, finit par ses étapes, pas par la durée
    coinsList.length = c0; patOrder.push(pi); nextSpawn = 999; return; }
  lastAir = airKind(pi); spawnI++;
  coinsList = coinsList.filter(cn => !journos.slice(n0).some(j => Math.abs(cn.x - j.x) < j.w/2 + 26));   // pas de pièces au-dessus des obstacles
  { const fb = newBlock(); coinLines(x + w + sec(0.15), bandY(pick(['low', 'mid', 'high'])), 8 + Math.floor(rnd()*6), fb, 1 + Math.floor(rnd()*2)); w += (8 + 5)*coinGap() + sec(0.15); }   // un ruban de plus entre deux motifs
  nextSpawn = (w + sec(0.2 + rnd()*0.25 + (1 - lvlDiff())*0.5))/worldSpeed();   // séquences faciles : plus d'espace entre les motifs
}
// le tuto commence par des pièces seules (rubans sur l'eau, montée naturelle, bloc), jusqu'à en avoir ramassé dix
function spawnTutoCoins(){
  const x = VWW + 60, b = newBlock(), k = spawnI % 3; let xe;
  if (k === 0) xe = coinLines(x, P.yMax - coinGap(), 10, b, 2);
  else if (k === 1){ const pts = simPath(WATER - 90, [[true, 0.8], [false, 0.6]]); xe = coinPath(x, pts, b, 0, undefined, 2); }

// tout coûte des sondages : la perte, le pop, la secousse ; sous pollOut le chapitre est perdu ; en passant sous pollFall, Marine tombe de sa planche (événement, pas seuil : elle remonte à la prochaine bonne action)

let lineT = 0;
function updateStorm(dt){
