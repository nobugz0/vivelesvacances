<style>
/* Layout: one-screen landscape game. The world is pixel art (sprite sheets); every menu, card and HUD element is a sober, non-pixel UI. Single bright look by choice. */
:root{
  --ink:#1b1f2a; --muted:#5b6475; --paper:#ffffff; --line:#e3e7ee; --accent:#d63b3b; --blue:#2563eb; --green:#16a34a;
  --ui:Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; --title:Fraunces,Georgia,serif;
  color-scheme: light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:#0f1d33;color:var(--ink);font-family:var(--ui);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0;background:#4a90d9}
canvas{display:block;width:100%;height:100%;touch-action:none}
.corner{position:absolute;top:30px;right:12px;display:flex;gap:8px;z-index:5}
.ib{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(15,29,51,.25);cursor:pointer;display:grid;place-items:center;color:var(--ink);padding:0}
.ib:hover{background:#fff}
.ib:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ib svg{width:20px;height:20px}
.ib img{width:24px;height:24px;object-fit:contain;display:block}
@media (pointer: coarse){ .corner{gap:10px} .ib{width:38px;height:38px} .ib svg{width:19px;height:19px} .ib img{width:24px;height:24px} }
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-inline:16px;background:rgba(15,29,51,.4);z-index:4}
.card{background:#fffaf0;border:3px solid #1b2433;border-radius:10px;box-shadow:7px 7px 0 #1b2433;max-width:520px;width:100%;max-height:calc(100% - 28px);overflow:auto;padding:26px 28px;display:flex;flex-direction:column;gap:12px;text-align:center;box-sizing:border-box}
.logo{font-weight:800;font-size:clamp(2rem,6.5vw,3rem);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
.card p{margin:0;font-size:1.05rem;line-height:1.4;color:var(--ink)}
.card .small{font-size:.85rem;color:var(--muted)}
.tiles{display:flex;gap:12px;justify-content:center}
.tile{flex:1;min-width:0;background:#fff;border:3px solid #1b2433;border-radius:8px;box-shadow:4px 4px 0 #1b2433;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile svg{width:30px;height:30px}
.tile b{font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.card .score{font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.actions{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.big{font-family:var(--ui);font-weight:800;font-size:1.15rem;background:var(--ink);color:#fff;border:3px solid #1b2433;border-radius:8px;box-shadow:4px 4px 0 #1b2433;padding:11px 28px;cursor:pointer}
.big:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1b2433}
.big.go{background:var(--green)}
.big.go:hover{background:#12873d}
.big:not(.go):hover{background:#2c3446}
.tuto{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;cursor:pointer;padding:8px 14px;border:3px solid #1b2433;border-radius:8px;background:#fff;box-shadow:4px 4px 0 #1b2433}
.tuto input{width:18px;height:18px;accent-color:var(--green);margin:0}
button.tuto{font-family:var(--ui);color:var(--ink)}
.tuto svg{width:18px;height:18px}
.levels{display:inline-flex;border:3px solid #1b2433;border-radius:8px;box-shadow:4px 4px 0 #1b2433;overflow:hidden;background:#fff}
.levels button{font-family:var(--ui);font-weight:800;font-size:.95rem;border:0;background:#fff;color:var(--ink);padding:8px 12px;cursor:pointer}
.levels button+button{border-left:2px solid #1b2433}
.levels button[aria-pressed="true"]{background:var(--ink);color:#fff}
#debug select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px 6px}
/* title and end screens: the illustration is laid out in image pixels (u = one image pixel), the card covers the painted one */
.screen{position:absolute;inset:0;z-index:4;overflow:hidden;background:#0f1d33}
.sbg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(18px) brightness(.8)}
.stage{position:absolute;--u:1px}
.stage>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.scard{position:absolute;box-sizing:border-box;background:#fffaf0;border:calc(var(--u)*6) solid #14213d;border-radius:calc(var(--u)*16);box-shadow:calc(var(--u)*10) calc(var(--u)*10) 0 rgba(20,26,40,.85);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;color:#14213d}
.scard h1{margin:0;line-height:1.05;letter-spacing:-.01em}
.scard p{margin:0}
.s-start{padding:calc(var(--u)*34) calc(var(--u)*30) calc(var(--u)*26)}
.s-start h1{font-family:var(--title);font-weight:900;font-size:calc(var(--u)*112);color:#13234a;text-shadow:0 calc(var(--u)*-3) 0 #f2b630,calc(var(--u)*3) 0 0 #f2b630,0 calc(var(--u)*3) 0 #f2b630,calc(var(--u)*-3) 0 0 #f2b630,calc(var(--u)*6) calc(var(--u)*6) 0 rgba(20,26,40,.35)}
.s-start #tSub{font-family:var(--ui);font-weight:700;font-size:calc(var(--u)*40);line-height:1.25;max-width:calc(var(--u)*980)}
.s-end{padding:calc(var(--u)*30) calc(var(--u)*30) calc(var(--u)*30)}
.s-end h1{font-family:var(--title);font-weight:900;font-size:calc(var(--u)*70)}
.ssub{font-size:calc(var(--u)*28);font-weight:600;color:#5b6475}
.ssub:empty{display:none}
.srow{display:flex;gap:calc(var(--u)*22);align-items:stretch;justify-content:center;width:100%}
.sbtn{white-space:nowrap;font-family:var(--ui);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--u)*14);background:#fff;color:#14213d;border:calc(var(--u)*5) solid #14213d;border-radius:calc(var(--u)*12);box-shadow:calc(var(--u)*6) calc(var(--u)*6) 0 #14213d;cursor:pointer;padding:0 calc(var(--u)*26);box-sizing:border-box}
.sbtn:active{transform:translate(calc(var(--u)*4),calc(var(--u)*4));box-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 #14213d}
.sbtn.go{background:#22a447;color:#fff}
.sbtn.ic{padding:0;aspect-ratio:1/1}
.s-start .sbtn.ic{width:calc(var(--u)*116)}
.s-end .sbtn.ic{width:calc(var(--u)*86)}
.sbtn.go:hover{background:#1c8f3d}
.sbtn svg{width:calc(var(--u)*44);height:calc(var(--u)*44)}
.sbtn input{width:calc(var(--u)*40);height:calc(var(--u)*40);accent-color:#22a447;margin:0}
.s-start .sbtn{font-family:var(--ui);font-size:calc(var(--u)*44);height:calc(var(--u)*116);font-weight:800}
.s-start .sbtn.go{font-size:calc(var(--u)*56);min-width:calc(var(--u)*390);font-weight:700}
.s-end .srow{gap:calc(var(--u)*16)}
.s-end .sbtn{font-size:calc(var(--u)*30);height:calc(var(--u)*86);padding:0 calc(var(--u)*18);gap:calc(var(--u)*10)}
.s-end .sbtn svg{width:calc(var(--u)*38);height:calc(var(--u)*38)}
.s-end .sbtn input{width:calc(var(--u)*34);height:calc(var(--u)*34)}
.s-end .sbtn.go{font-size:calc(var(--u)*40);min-width:calc(var(--u)*270)}
.srec{font-size:calc(var(--u)*30);font-weight:600;color:#3d5a8a}
.s-start .srec{font-family:var(--ui)}
.srec:empty{visibility:hidden}
.stiles{display:flex;gap:calc(var(--u)*22);width:100%;justify-content:center}
.stile{flex:1;background:#fff;border:calc(var(--u)*5) solid #14213d;border-radius:calc(var(--u)*12);box-shadow:calc(var(--u)*6) calc(var(--u)*6) 0 #14213d;padding:calc(var(--u)*14) calc(var(--u)*8);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*4)}
.stile svg{width:calc(var(--u)*50);height:calc(var(--u)*50)}
.stile b{font-size:calc(var(--u)*48);line-height:1.1;font-variant-numeric:tabular-nums}

  "s": "Le « candidat du peuple » officialise sa relation avec une princesse de la jet-set européenne. En couverture de Paris Match, pour rester proche des gens…",
  "d": "Le 9 avril 2026, Jordan Bardella officialise en couverture de Paris Match sa relation avec la princesse Maria-Carolina de Bourbon des Deux-Siciles, figure de la jet-set européenne. Jusque-là discret sur sa vie privée, il avait été vu quelques semaines plus tôt avec elle au Grand Palais, lors des 200 ans du Figaro. Pour le communicant Philippe Moreau Chevrolet, interrogé par Public Sénat, cette couverture marque son entrée en campagne, avec le risque de passer du « candidat du peuple » à la jet-set.",
  "src": ["Public Sénat, Simon Barbarit, 09/04/2026"], "r": "Une princesse ? Moi, j’ai mes chats."},
  {"who": "bard",
  "t": "Les droits des femmes, ça dépend où",
  "s": "En 2024, Jordan Bardella s’abstient sur l’inscription de l’IVG dans la Charte européenne des droits fondamentaux. Le même parti la vote dans la Constitution française deux mois plus tôt. À Strasbourg on s’abstient, à Paris on applaudit.",
  "d": "Le 26 novembre 2020, Jordan Bardella vote contre la résolution du Parlement européen dénonçant l’interdiction de fait de l’avortement en Pologne. Le 11 avril 2024, il s’abstient sur la résolution demandant d’inscrire le droit à l’avortement dans la Charte des droits fondamentaux de l’Union, comme 12 des 13 eurodéputés RN qui votent. Deux mois plus tôt, à Paris, Marine Le Pen et la majorité des députés RN votaient l’inscription de l’IVG dans la Constitution française. Jordan Bardella dit vouloir travailler « pour les droits des femmes ».",
  "src": ["Parlement européen, votes nominaux du 26/11/2020 et du 11/04/2024 (via HowTheyVote.eu)",
  "Europe 1, 21/06/2024"], "r": "Il s’abstient, moi je vote. Ça équilibre."},
  {"who": "rn",
  "t": "Le kit du parfait candidat",
  "s": "En 2012, le micro-parti de Marine Le Pen vend aux candidats FN des kits de campagne surfacturés, remboursés par l’État. Le RN est définitivement condamné en 2024. Le contribuable, lui, avait déjà payé…",
  "d": "Pour les législatives de 2012, Jeanne, le micro-parti de Marine Le Pen, vend aux candidats du Front national des « kits de campagne » à 16 650 € : tracts, affiches, site internet et aide à la présentation des comptes. La justice juge ces prestations surfacturées au détriment de l’État, qui rembourse les dépenses des candidats ayant dépassé 5 % des voix. En mars 2023, la cour d’appel de Paris condamne le RN à 250 000 € d’amende pour recel d’abus de biens sociaux, estimant que le système « a porté atteinte aux règles de la démocratie ». Le 19 juin 2024, la Cour de cassation rend la condamnation définitive.",
  "src": ["Europe 1, 19/06/2024 (mis à jour le 06/11/2024)"], "r": "Recel ? Moi ? C’était le parti !"},
  {"who": "rn",
  "t": "Des prêteurs qui vous veulent du bien",
  "s": "Le RN doit plus de 20 millions d’euros à des particuliers. En juillet 2025, la brigade financière perquisitionne son siège. Entre amis, on ne compte pas…",
  "d": "Le 9 juillet 2025, la brigade financière perquisitionne le siège du RN à Paris, dans le cadre d’une information judiciaire ouverte en juillet 2024 sur le financement de la présidentielle de 2022, des législatives qui ont suivi et des européennes de 2024. Les juges s’intéressent à des prêts de particuliers au parti et à ses candidats, ainsi qu’à des prestations surfacturées ou fictives remboursées par l’État. Le RN concentre l’essentiel de ces prêts : 425 sur 492 en 2022. Fin 2023, il devait plus de 20 millions d’euros à des particuliers. Jordan Bardella dénonce un « acharnement ».",
  "src": ["Le Petit Journal avec AFP, 09/07/2025"], "r": "Des prêts entre amis, c’est interdit ?"},
  {"who": "rn",
  "t": "Le dossier pas regardé",
  "s": "Le Parquet européen enquête sur 4,3 millions d’euros dépensés par l’ancien groupe du RN au Parlement européen, surtout auprès de deux sociétés proches de Marine Le Pen.",
  "d": "En novembre 2025, le Parquet européen ouvre une enquête sur plus de 4,3 millions d’euros de dépenses du groupe Identité et Démocratie, auquel appartenait le RN au Parlement européen, entre 2019 et 2024. Un rapport interne du Parlement juge ces dépenses irrégulières. L’essentiel est allé à deux sociétés liées à des proches de Marine Le Pen : e-Politic (environ 1,7 million d’euros, après un appel d’offres jugé « purement formel ») et Unanime (plus de 1,4 million d’euros pour de l’impression sous-traitée). Interrogée, Marine Le Pen répond : « je n’ai pas regardé ce dossier ».",
  "src": ["Brut, 17/11/2025"], "r": "4 millions ? Je n’ai pas regardé le dossier."},
  {"who": "rn",
  "t": "Après Moscou, Budapest",
  "s": "Pour sa campagne de 2022, Marine Le Pen emprunte à une banque hongroise proche du pouvoir de Viktor Orbán. Mais pour 2027, promis, plus d’argent étranger !",
  "d": "Pour la présidentielle de 2022, après des refus de banques européennes, Marine Le Pen obtient un prêt d’environ 10,7 millions d’euros de la banque hongroise MKB, en partie détenue par Lőrinc Mészáros, ami d’enfance de Viktor Orbán. En mai 2026, Europe 1 rappelle que cette campagne a été « largement financée par une banque hongroise ». Face aux refus des banques françaises pour 2027, l’entourage du RN assure vouloir écarter tout financement étranger : « les temps ont changé ».",
  "src": ["Hungary Today, mars 2022 (média proche du gouvernement hongrois)",
  "Europe 1, Mayalène Trémolet, 12/05/2026"], "r": "Orbán me fait confiance, lui !"},
  {"who": "rn",
  "t": "Le soutien à géométrie variable",
  "s": "Marine Le Pen condamne l’invasion de l’Ukraine « sans ambiguïté ». Mais quand il faut voter le soutien à Kiev, le RN s’abstient… trois fois.",
  "d": "Le 25 février 2022, Marine Le Pen condamne « sans ambiguïté » la violation de la souveraineté ukrainienne. À l’Assemblée nationale, le groupe RN s’abstient pourtant sur la résolution de soutien à l’Ukraine condamnant la guerre menée par la Russie (30 novembre 2022), sur la déclaration du gouvernement relative à l’accord de sécurité franco-ukrainien (12 mars 2024) et sur la résolution européenne appelant à renforcer le soutien à l’Ukraine (12 mars 2025). Marine Le Pen s’abstient elle aussi à chaque fois.",
  "src": ["Europe 1 avec AFP, 25/02/2022",
  "Assemblée nationale, scrutins n° 652 (16e lég.), n° 3461 (16e lég.) et n° 988 (17e lég.)"], "r": "Je condamne… et je m’abstiens."},
  {"who": "rn",
  "t": "Zucman, ni oui ni non",
  "s": "En février 2025, le RN s’abstient sur la taxe Zucman. Quelques mois plus tard, Marine Le Pen n’en veut « ni hard, ni light, ni rien du tout ». Il fallait le temps d’y réfléchir…",
  "d": "Le 20 février 2025, les députés RN s’abstiennent sur la proposition de loi instaurant un impôt plancher de 2 % sur le patrimoine des ultra-riches, dite taxe Zucman, adoptée en première lecture. À l’automne 2025, pendant le débat budgétaire, Marine Le Pen rejette toute version de cette taxe : « Zucman non, ni hard, ni light, ni rien du tout ».",
  "src": ["Assemblée nationale, scrutin n° 881 (17e lég.), 20/02/2025",
  "Brut, 17/11/2025"], "r": "Zucman, gauchiste !"},
  {"who": "rn",
  "t": "Le racisme, sans avis",
  "s": "En mars 2024, les députés RN s’abstiennent sur une loi qui durcit les sanctions contre les infractions racistes et antisémites. Quatre mois plus tard, Jordan Bardella découvre ses brebis galeuses…",
  "d": "Le 6 mars 2024, les 17 députés RN présents s’abstiennent sur la proposition de loi visant à renforcer la réponse pénale contre les infractions à caractère raciste, antisémite ou discriminatoire, adoptée en première lecture. En juillet, pendant les législatives, Jordan Bardella doit écarter plusieurs candidats RN pour des propos racistes ou antisémites.",
  "src": ["Assemblée nationale, scrutin n° 3431 (16e lég.), 06/03/2024",
  "LCP, Raphaël Marchal, 04/07/2024"], "r": "Je m’abstiens avec conviction."},
  {"who": "rn",
  "t": "Inutile, mais votée",
  "s": "Marine Le Pen jugeait l’IVG « pas en danger » en France. En 2024, elle vote son inscription dans la Constitution, tout en jugeant que ça « ne sert à rien ». En 2011, elle voulait dérembourser les « avortements de confort »…",
  "d": "En novembre 2022, le RN refuse d’inscrire l’IVG dans la Constitution, au motif qu’elle n’est « pas en danger » en France ; Marine Le Pen propose plutôt d’y figer le droit en vigueur, dont le délai de 14 semaines qu’elle avait combattu. Le 30 janvier 2024, elle vote la constitutionnalisation de l’IVG tout en estimant qu’elle « ne sert à rien » ; son groupe se divise (46 pour, 12 contre, 14 abstentions). En 2011, elle proposait de dérembourser certains « avortements de confort ».",
  "src": ["LCP, Soizic Bonvarlet, 22/11/2022",
  "Europe 1, 21/06/2024",
  "Assemblée nationale, scrutin n° 3289 (16e lég.), 30/01/2024"], "r": "Avortement de confort ? J’ai dit ça, moi ?"}];
const VOLTES = [{"sujet": "Russie", "titre": "Russie : 13 jours pour changer d’ami", "per": "11 → 24 février 2022", "old": "Négocier une entente avec la Russie de Vladimir Poutine.", "neu": "Exiger « la cessation immédiate des opérations russes ».", "d": "Le 11 février 2022 à Toulon, Marine Le Pen propose de quitter le commandement intégré de l’OTAN et de négocier une entente avec la Russie. Le 24 février, jour de l’invasion de l’Ukraine, Marine Le Pen réclame « la cessation immédiate des opérations russes ». Le lendemain, sur BFMTV et RMC, Marine Le Pen condamne « sans ambiguïté » la violation de la souveraineté ukrainienne, tout en mettant en garde contre l’effet des sanctions sur le pouvoir d’achat.", "src": ["Europe 1, Victor Chabert, 12/02/2022", "Le Petit Journal/AFP, 24/02/2022", "Europe 1 avec AFP, 25/02/2022"]},
  {"sujet": "OTAN", "titre": "OTAN : une promesse vite suspendue", "per": "mars 2022", "old": "Quitter le commandement intégré de l’OTAN dès 2022.", "neu": "Rester dans le commandement intégré tant que dure la guerre en Ukraine.", "d": "Le programme présidentiel de Marine Le Pen, publié fin mars 2022, promet de sortir la France du commandement intégré de l’OTAN dès 2022, comme le général de Gaulle en 1966. La guerre en Ukraine a alors commencé depuis un mois. Le lendemain, sur CNews, Marine Le Pen précise qu’elle ne quittera pas le commandement intégré tant que dure la guerre, mais le fera une fois le conflit terminé. En mai 2026, sur BFMTV, Marine Le Pen répète : « Nous devons sortir du commandement intégré de l’OTAN ».", "src": ["Europe 1, Gauthier Delomez, 23/03/2022", "Public Sénat, Pierre-Louis Boucé, 25/03/2022", "Reuters, Sabine Siebold et John Irish, 23/05/2026"]},
  {"sujet": "Voile", "titre": "Voile islamique : « nous y arriverons »… ou pas", "per": "avril 2022", "serie": "voile", "rang": 1, "old": "Interdire le voile islamique dans l’espace public, sous peine d’amende.", "neu": "Confier ce « problème complexe » au Parlement.", "d": "En avril 2022, Marine Le Pen annonce une amende pour sanctionner le port du voile dans l’espace public et assure sur BFMTV : « Ne vous inquiétez pas, nous y arriverons ». Dans l’entre-deux-tours, Marine Le Pen se dit « pas obtuse » et renvoie ce « problème complexe » à la discussion parlementaire. Au débat du 20 avril, Marine Le Pen maintient que « le voile est un uniforme imposé par les islamistes ».", "src": ["Europe 1, Laura Laplaud, 21/04/2022", "Public Sénat, Simon Barbarit, 19/04/2022", "Europe 1 avec AFP, 20/04/2022"]},
  {"sujet": "Voile (bis)", "titre": "Voile islamique : le retour, par référendum", "per": "avril 2022 → août 2026", "serie": "voile", "rang": 2, "old": "Confier l’interdiction du voile islamique au Parlement.", "neu": "Pénaliser le voile islamiste dans l’espace public par référendum.", "d": "En avril 2022, Marine Le Pen renvoie l’interdiction du voile dans l’espace public au Parlement, qu’elle qualifie de « problème complexe ». Le 31 août 2026, Marine Le Pen promet de soumettre par référendum « une grande loi de lutte contre les idéologies islamistes », qui inclut la pénalisation du voile islamiste dans l’espace public. Le même jour, Jordan Bardella assure qu’il n’y aura pas de « police du vêtement ».", "src": ["Public Sénat, Simon Barbarit, 19/04/2022", "TelQuel/AFP, 01/09/2026", "Sud Radio avec AFP, 31/08/2026"]},
  {"sujet": "Loi immigration", "titre": "Loi immigration : contre, puis pour", "per": "11 → 19 décembre 2023", "old": "Rejeter le projet de loi immigration.", "neu": "Voter le texte final, une « victoire idéologique ».", "d": "Le 11 décembre 2023, les 87 députés RN présents votent la motion de rejet du projet de loi immigration, qui est adoptée. Marine Le Pen se félicite d’avoir « protégé les Français d’un appel d’air migratoire ». Le 19 décembre, après la commission mixte paritaire, le groupe RN vote le texte final par 88 voix sur 88, et Marine Le Pen parle de « victoire idéologique ».", "src": ["Assemblée nationale, scrutins n° 3203 (11/12/2023) et n° 3213 (19/12/2023)", "Les Nouvelles Calédoniennes/AFP, 12/12/2023", "Le Petit Journal, Christophe Verger, 20/12/2023"]},
  {"sujet": "Retraites", "titre": "Retraites : « Nous verrons », puis à l’automne", "per": "12 → 17 juin 2024", "old": "Ne pas s’engager sur l’abrogation de la réforme de 2023 : « Nous verrons ».", "neu": "Abroger la réforme « à partir de l’automne ».", "d": "Pendant la campagne des législatives de 2024, Jordan Bardella répond « Nous verrons » sur RTL le 12 juin, quand on lui demande s’il abrogera la réforme des retraites de 2023. Le 14 juin, Jordan Bardella juge que ce n’est pas une priorité avant un audit des comptes. Le 17 juin, dans Le Parisien, Jordan Bardella annonce l’abrogation « à partir de l’automne ».", "src": ["Public Sénat, Guillaume Jacquot, 18/06/2024", "LCP, Maxence Kagni, 18/06/2024"]},
  {"sujet": "Âge légal", "titre": "Âge de départ : intouchable, puis à l’étude", "per": "juin 2024 → mai 2026", "old": "Ne pas relever l’âge légal de départ à la retraite.", "neu": "Étudier un relèvement de l’âge légal de départ.", "d": "Le 20 juin 2024, devant les organisations patronales, Jordan Bardella affirme qu’il ne décalera pas l’âge légal de départ à la retraite. En mai 2026, dans un entretien au Frankfurter Allgemeine Zeitung, Jordan Bardella indique que le RN « examine » un possible relèvement de l’âge légal.", "src": ["Public Sénat, Guillaume Jacquot, 20/06/2024", "Public Sénat, Stéphane Duguet, 12/06/2026"]},
  {"sujet": "TVA sur 100 produits", "titre": "TVA sur 100 produits : sous conditions", "per": "mars 2022 → juin 2024", "serie": "tva", "rang": 1, "old": "Supprimer la TVA sur 100 produits de première nécessité.", "neu": "Ne la supprimer qu’en cas de forte inflation.", "d": "Le 14 mars 2022, Marine Le Pen propose de supprimer la TVA sur un panier de produits de première nécessité, financée par une taxe sur les rachats d’actions. Dans le programme des législatives de juin 2024, présenté par Jordan Bardella, la suppression de la TVA sur 100 produits de première nécessité ne s’appliquerait plus qu’en cas de forte inflation.", "src": ["Public Sénat, François Vignal, 14/03/2022", "Public Sénat, Romain David, 27/06/2024"]},
  {"sujet": "TVA (bis)", "titre": "TVA sur 100 produits : le retour", "per": "juin 2024 → octobre 2025", "serie": "tva", "rang": 2, "old": "Ne supprimer la TVA sur 100 produits qu’en cas de forte inflation.", "neu": "Inscrire une TVA nulle sur 100 produits dans le contre-budget du RN.", "d": "Dans le programme des législatives de juin 2024, la suppression de la TVA sur 100 produits de première nécessité ne s’applique plus qu’en cas de forte inflation. En octobre 2024, le contre-budget 2025 du groupe RN, présidé par Marine Le Pen, prévoit la suppression de la TVA sur les produits de première nécessité. En octobre 2025, le contre-budget du RN pour 2026 inscrit une TVA nulle sur 100 produits.", "src": ["Public Sénat, Romain David, 27/06/2024", "LCP, Maxence Kagni, 16/10/2024", "Public Sénat, Romain David, 24/10/2025"]},
  {"sujet": "Électricité", "titre": "Électricité : sortir du marché, ou juste négocier", "per": "mars 2022 → juin 2024", "old": "Sortir du marché européen de l’électricité.", "neu": "Négocier une dérogation au marché européen pour un prix français.", "d": "Le 14 mars 2022, Marine Le Pen propose de sortir du marché européen libéralisé de l’énergie et de rétablir des prix régulés. Le 14 juin 2024 sur BFMTV-RMC, Jordan Bardella propose plutôt de négocier une dérogation au marché européen de l’électricité pour obtenir un prix français.", "src": ["Public Sénat, François Vignal, 14/03/2022", "LCP, Soizic Bonvarlet, 17/06/2024"]},
  {"sujet": "Inéligibilité", "titre": "L’inéligibilité à vie… pour les autres", "per": "2013 → 31 mars 2025", "old": "Rendre inéligibles à vie tous les élus condamnés.", "neu": "Dénoncer sa propre inéligibilité comme une « décision politique ».", "d": "En 2013, Marine Le Pen réclamait « l’inéligibilité à vie pour tous ceux qui ont été condamnés ». Le 31 mars 2025, condamnée en première instance à 5 ans d’inéligibilité avec exécution provisoire dans l’affaire des assistants parlementaires européens, Marine Le Pen dénonce sur TF1 une « décision politique » : « Soyons bien clairs, je suis éliminée ».", "src": ["Public Sénat, vidéo de 2013", "Public Sénat, François Vignal, 31/03/2025"]},
  {"sujet": "Nucléaire", "titre": "Sûreté nucléaire : contre, puis pour", "per": "19 mars → 9 avril 2024", "old": "Voter contre la réforme de la sûreté nucléaire.", "neu": "Voter pour le texte final de la même réforme.", "d": "Le 19 mars 2024, les 84 députés RN présents votent contre le projet de loi sur la gouvernance de la sûreté nucléaire, qui fusionne l’ASN et l’IRSN. Marine Le Pen vote contre. Le 9 avril 2024, après la commission mixte paritaire, les 82 députés RN présents votent pour le texte final. Marine Le Pen vote pour.", "src": ["Assemblée nationale, scrutins n° 3546 (19/03/2024) et n° 3662 (09/04/2024)"]}];

function generateLevel(){

  for (const bg of bigs) zones.push(bigZone(bg));

    for (const z of zs){ if (z.a > cur) free.push([cur, z.a]); cur = Math.max(cur, z.b); }
    if (cur < TOTAL_WEEKS - 3) free.push([cur, TOTAL_WEEKS - 3]);
